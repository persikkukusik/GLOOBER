<script>
// SEARCH FOR THE FETCH FUNCTION THAT CONTAINS HEADERS
// This is the critical fix: ensure all fetch headers contain only ASCII characters
// The error "Failed to execute 'fetch' on 'Window': Failed to read the 'headers' property from 'RequestInit'"
// means there's a non-ISO-8859-1 character in a header value

// Here's the general fix pattern to apply everywhere you make fetch() calls:

// WRONG (may have unicode):
// fetch(url, {
//   headers: {
//     'Authorization': 'Bearer ' + userToken  // if token has emoji or unicode, this breaks
//   }
// })

// CORRECT (ensure ASCII only):
function sanitizeHeaderValue(value) {
  // Remove any non-ASCII characters (keep only 0x00-0x7F)
  return String(value).replace(/[^\x00-\x7F]/g, '');
}

// When making fetch calls to Groq API, use like this:
// const headers = {
//   'Authorization': 'Bearer ' + sanitizeHeaderValue(state.token),
//   'Content-Type': 'application/json'
// };

// Apply this fix to your sendMessage() function and any other fetch() calls
</script>
